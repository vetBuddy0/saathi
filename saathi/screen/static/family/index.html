<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kaki">
  <title>Kaki</title>
  <link rel="manifest" href="/family/manifest.webmanifest">
  <link rel="icon" href="/family/static/icon-192.png">
  <link rel="apple-touch-icon" href="/family/static/icon-192.png">
  <link rel="stylesheet" href="/family/static/app.css">
</head>
<body>
  <!-- The family app (call/family_server.py serves it; app.js drives it).
       One screen at a time; app.js shows the one that fits. -->
  <main>
    <section id="screen-unpaired" hidden>
      <h1>Kaki</h1>
      <p class="big">This phone isn't paired yet.</p>
      <p>On Kaki, press <b>Ctrl+P</b> and scan the code with this phone's camera.</p>
    </section>

    <section id="screen-pair" hidden>
      <h1>Pair with Kaki</h1>
      <form id="pair-form">
        <label>Your name
          <input id="pair-name" name="name" autocomplete="given-name" required maxlength="40">
        </label>
        <label>You are her…
          <select id="pair-relation" name="relation">
            <option value="daughter">Daughter</option>
            <option value="son">Son</option>
            <option value="granddaughter">Granddaughter</option>
            <option value="grandson">Grandson</option>
            <option value="sister">Sister</option>
            <option value="brother">Brother</option>
            <option value="daughter-in-law">Daughter-in-law</option>
            <option value="son-in-law">Son-in-law</option>
            <option value="niece">Niece</option>
            <option value="nephew">Nephew</option>
            <option value="friend">Friend</option>
            <option value="carer">Carer</option>
            <option value="">Other</option>
          </select>
        </label>
        <label>What do you call her?
          <input id="pair-her" name="calls_her" placeholder="Mum" maxlength="40">
        </label>
        <button type="submit" class="btn btn-go">Pair this phone</button>
        <p id="pair-error" class="error" hidden></p>
      </form>
    </section>

    <section id="screen-home" hidden>
      <h1 id="home-title">Kaki</h1>
      <button id="call-her" class="btn btn-go btn-round">Call</button>
      <div id="alerts" hidden>
        <p>Turn on call alerts so this phone rings when she calls.</p>
        <button id="alerts-on" class="btn">Turn on call alerts</button>
      </div>
      <p id="ios-hint" class="hint" hidden>To receive calls on iPhone: tap Share, then
        <b>Add to Home Screen</b>, and open Kaki from there.</p>
      <p id="home-status" class="hint"></p>
    </section>

    <section id="screen-ringing" hidden>
      <p class="caption">Kaki</p>
      <h1 id="ringing-name">is calling</h1>
      <div class="row">
        <button id="decline" class="btn btn-stop btn-round">Decline</button>
        <button id="answer" class="btn btn-go btn-round">Answer</button>
      </div>
    </section>

    <section id="screen-call" hidden>
      <p class="caption" id="call-status">Calling…</p>
      <h1 id="call-name"></h1>
      <p id="call-timer" class="timer"></p>
      <button id="end" class="btn btn-stop btn-round">End</button>
    </section>
  </main>
  <audio id="remote" autoplay playsinline></audio>
  <script type="module" src="/family/static/app.js"></script>
</body>
</html>
