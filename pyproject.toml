[project]
name = "saathi"
version = "0.1.0"
description = "A companion device for an elderly person living alone."
readme = "SPEC.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "deno>=2.9.7",
    # audio/wake.py: hears "Saathi" on-device (tiny.en). Was the
    # `hardware` group, for smoke.py's AEC check only, until the wake
    # word needed it in every run. MIT; aarch64 wheels via ctranslate2.
    "faster-whisper>=1.0",
    "groq>=1.7.0",
    "numpy>=2.5.3",
    # identity/embed.py's local sentence embeddings (MiniLM, Apache 2.0).
    # Already installed transitively through piper-tts; pinned here
    # explicitly so retrieval's relevance axis doesn't depend on a TTS
    # backend's dependency list. MIT; manylinux_2_28_aarch64 wheel.
    "onnxruntime>=1.30.0",
    "openai>=3.19.2",
    "piper-tts>=1.8.0",
    # call/push.py: Web Push (VAPID ES256 + RFC 8291 aes128gcm) for the
    # family app's ring. Already installed via yt-dlp[default]; named
    # here because ringing must not depend on a YouTube library's
    # extras. BSD-2; abi3 aarch64 wheels.
    "pycryptodomex>=3.21",
    "pysilero-vad>=3.4.0",
    "pyudev>=0.24; sys_platform == 'linux'",
    "pywebrtc-audio>=0.2.0",
    # call/family_server.py: the pairing QR code. Pure Python, no
    # dependencies, BSD-3; py3-none-any wheel.
    "segno>=1.6",
    # cascade.py's STT upload: FLAC instead of raw WAV. Real, small
    # aarch64 wheel (1.2MB, wraps libsndfile) -- measured live against
    # the real Whisper endpoint, ~11% faster median time-to-response
    # than WAV for the same audio, from a smaller upload. See
    # docs/completed/latency-investigation.md for the numbers.
    "soundfile>=0.14.0",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
saathi = "saathi.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
# saathi/voice/tts/kokoro_backend.py. Not installed by default or in CI:
# torch is an unconditional dependency (a real aarch64 wheel exists, but
# it's 454MB -- see that module's docstring). KokoroBackend.available()
# reports its absence as an ordinary unavailable-backend reason.
kokoro = [
    "kokoro>=0.9.4",
]
# saathi/voice/tts/google_backend.py. Not installed by default or in CI:
# needs real GCP credentials to do anything, which CI doesn't have.
# GoogleNeural2WaveNetBackend/GoogleChirp3HDBackend.available() report
# its absence the same way.
google-tts = [
    "google-cloud-texttospeech>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saathi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# F821 (undefined name) is the check CLAUDE.md calls out as load-bearing:
# a rename that missed a call site already shipped a crash on this project.
select = ["E", "F", "W"]
