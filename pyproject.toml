[project]
name = "saathi"
version = "0.1.0"
description = "A companion device for an elderly person living alone."
readme = "SPEC.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "groq>=1.7.0",
    "numpy>=2.5.3",
    "piper-tts>=1.8.0",
    "pysilero-vad>=3.4.0",
    "pyudev>=0.24; sys_platform == 'linux'",
    "pywebrtc-audio>=0.2.0",
]

[project.scripts]
saathi = "saathi.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
# STT for smoke.py's hardware-in-the-loop AEC check only (SPEC.md,
# "Audio"). Not a dependency of the default install or CI: that check
# needs a real speaker and mic, so it never runs headless.
hardware = [
    "faster-whisper>=1.0",
]
# saathi/voice/tts/kokoro_backend.py. Not installed by default or in CI:
# torch is an unconditional dependency (a real aarch64 wheel exists, but
# it's 454MB -- see that module's docstring). KokoroBackend.available()
# reports its absence as an ordinary unavailable-backend reason.
kokoro = [
    "kokoro>=0.9.4",
]
# saathi/voice/tts/google_backend.py. Not installed by default or in CI:
# needs real GCP credentials to do anything, which CI doesn't have.
# GoogleNeural2WaveNetBackend/GoogleChirp3HDBackend.available() report
# its absence the same way.
google-tts = [
    "google-cloud-texttospeech>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saathi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# F821 (undefined name) is the check CLAUDE.md calls out as load-bearing:
# a rename that missed a call site already shipped a crash on this project.
select = ["E", "F", "W"]
